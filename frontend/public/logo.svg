<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Fond sombre arrondi -->
  <rect width="512" height="512" rx="96" fill="#06140f"/>
  
  <!-- Cercle doré -->
  <circle cx="256" cy="256" r="180" fill="url(#goldGradient)"/>
  
  <!-- Symbole ₣ -->
  <text x="256" y="340" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="260" font-weight="800" text-anchor="middle" fill="#3a2600">₣</text>
  
  <!-- Dégradé doré -->
  <defs>
    <radialGradient id="goldGradient" cx="30%" cy="30%">
      <stop offset="0%" stop-color="#fff3b0"/>
      <stop offset="50%" stop-color="#f2b632"/>
      <stop offset="100%" stop-color="#9a6a08"/>
    </radialGradient>
  </defs>
</svg>